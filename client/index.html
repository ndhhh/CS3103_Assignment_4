<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <link rel="stylesheet" href="styles.css?v=page-scroll">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <a class="brand" href="./" aria-label="LiveRecall home">LiveRecall<span>.</span></a>
        <details class="developer-options">
          <summary>Developer options</summary>
          <div class="developer-controls">
            <p>Check reconnect and recovery behavior.</p>
            <button id="disconnect" type="button">Simulate disconnect</button>
            <button id="reset" type="button">Reset client</button>
          </div>
        </details>
      </div>
      <span id="status" role="status" data-state="disconnected">disconnected</span>
    </header>

    <main>
      <section class="reader" aria-labelledby="reader-title">
        <div class="reader-header">
          <div>
            <p class="eyebrow">Stay with the lecture</p>
            <h1 id="reader-title">What did I miss?</h1>
          </div>
          <div class="window-picker" role="group" aria-label="Caption history window">
            <button type="button" data-seconds="15" aria-pressed="false">15 s</button>
            <button type="button" data-seconds="30" aria-pressed="true">30 s</button>
            <button type="button" data-seconds="60" aria-pressed="false">60 s</button>
          </div>
        </div>

        <p class="reader-hint">The latest sentence leads. Scroll down to catch up.</p>
        <div class="caption-stage">
          <div id="live" role="region" aria-label="Live captions, newest first"></div>
          <p id="empty-state">Waiting for the next sentence<span>Live captions will appear here.</span></p>
          <button id="back-to-live" type="button" hidden>Back to live <span aria-hidden="true">&#8593;</span></button>
        </div>
        <footer class="reader-footer">
          <span id="recall">Showing the last 30 seconds</span>
          <span>Newest first</span>
        </footer>
      </section>
    </main>

  </div>
  <script src="app.js?v=page-scroll"></script>
</body>
</html>
