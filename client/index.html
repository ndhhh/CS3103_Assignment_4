<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #status { font-weight: 700; }
    #live { min-height: 6rem; max-height: 22rem; overflow-y: auto; border: 1px solid #bbb; border-radius: .4rem; padding: 1rem; margin: 1rem 0; }
    .caption-line { padding: .45rem 0; border-bottom: 1px dotted #ddd; }
    .caption-line.provisional { color: #555; font-style: italic; }
    .caption-line.final { color: #171717; }
    button { padding: .55rem .75rem; margin: .2rem; }
    #recall { white-space: pre-wrap; margin-top: 1rem; border-left: 3px solid #ccc; padding-left: 1rem; }
    .hint { font-size: .9rem; color: #555; }
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <div>
    <p style="display:inline-block;">Connection: <span id="status">disconnected</span></p>
    <button id="disconnect" type="button">Simulate disconnect</button>
    <button id="reset" type="button">Reset client</button>
  </div>

  <p class="hint">Each segment keeps one row. Provisional revisions update it until the final caption arrives.</p>
  <div id="live"></div>
  <div>
    <button data-seconds="30">What did I miss? (30 s)</button>
    <button data-seconds="15">15 s</button>
    <button data-seconds="60">60 s</button>
  </div>
  <div id="recall">No finalized captions in the last 30 seconds.</div>
  <script src="app.js?v=ui-update"></script>
</body>
</html>
